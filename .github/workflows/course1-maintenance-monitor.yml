name: Course 1 scheduled dependency and source monitoring

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course1-maintenance-monitor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install the hash-locked SBOM validator
        run: >-
          python -m pip install
          --require-hashes
          -r tools/requirements-validation.txt

      - name: Audit dependencies, licences, provenance, SBOM, and advisories
        run: >-
          python tools/audit_course1_supply_chain.py
          --online
          --report maintenance-evidence/supply-chain.json

      - name: Audit claim-level source ownership, freshness, and availability
        run: >-
          python tools/audit_course1_sources.py
          --online
          --report maintenance-evidence/source-claims.json

      - name: Set up the pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Query npm advisories for the locked dependency-free PWA
        working-directory: app
        run: npm audit --package-lock-only --audit-level=low

      - name: Preserve machine-readable evidence even when a gate fails
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: course1-maintenance-evidence-${{ github.run_id }}
          path: maintenance-evidence
          if-no-files-found: warn
          retention-days: 90
