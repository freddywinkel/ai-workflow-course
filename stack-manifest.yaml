schema_version: 2
course_id: course-1-controlled-ai-workflow-foundations
course_version: 2.1.0
practice_revision: 2
last_verified: "2026-07-26"
verification_timezone: Europe/Amsterdam
purpose: private synthetic-data learning demonstration

runtime:
  operating_system: Windows 11
  python_target: "3.13"
  python_policy: "Use any audited supported Python >=3.12 that passes the clean test suite."
  orchestration: local n8n learning instance
  data_store: local synthetic CSV and JSON files

required:
  git:
    version_policy: current supported
    role: change inspection and version history
    source: https://git-scm.com/download/win
  python:
    version_policy: ">=3.12"
    role: deterministic rules, reports, and tests
    source: https://docs.python.org/3/using/windows.html
  pytest:
    version_policy: compatible current major, then freeze
    role: local regression tests
    source: https://docs.pytest.org/
  node:
    version_policy: current LTS supported by selected n8n
    role: local n8n runtime
    source: https://nodejs.org/en/download
  n8n:
    version_policy: current stable after live audit, then pin
    role: visual orchestration, branching, retry, and review pause
    source: https://docs.n8n.io/hosting/installation/npm/

ai:
  required_for_course_pass: false
  default_mode: offline-fixture
  live_lab:
    api_pattern: OpenAI Responses API or equivalent current structured-output API
    model_id_is_configuration: true
    model_environment_variable: AI_MODEL
    structured_output: JSON Schema
    raw_data_allowed: synthetic verified issue records only
    source: https://developers.openai.com/api/docs/guides/structured-outputs

deferred:
  - FastAPI or production web service
  - Docker
  - PostgreSQL or Supabase
  - OCR and document parsing
  - vector retrieval
  - OAuth production connectors
  - multitenancy
  - autonomous agents
  - external write-back

release_requires:
  - curriculum and source audit
  - exact dependency record
  - package validation
  - PWA tests
  - clean-start capstone reproduction
  - accessibility and responsive review
  - installed-client update verification
